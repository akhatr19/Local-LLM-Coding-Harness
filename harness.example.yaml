litellm:
  default_profile: local
  profiles:
    local:
      model: openai/qwen3-32b
      api_base: http://localhost:4000/v1
      timeout_seconds: 120
      max_tokens: 8192
      temperature: 0.1

searxng:
  base_url: http://localhost:8080
  timeout_seconds: 20
  result_limit: 8
  fetch_result_limit: 3
  max_fetch_bytes: 200000

retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  lexical_limit: 30
  vector_limit: 30
  final_limit: 20
  chunk_lines: 120
  chunk_overlap_lines: 20

agents:
  investigator_count: 4
  planner_count: 3
  judge_count: 3
  max_concurrency: 4
  clarification_rounds: 1

docker:
  image: python:3.11.13-slim-bookworm@sha256:86adf8dbadc3d6e82ee5dd2c74bec2e1c2467cdad47886280501df722372d2e1
  cpu_limit: 2.0
  memory_mb: 4096
  pids_limit: 256
  disk_mb: 1024
  tmpfs_mb: 256
  command_timeout_seconds: 300
  run_timeout_seconds: 3600
  max_commands: 12
  max_agent_steps: 24
  network_disabled: true

evaluation:
  dataset_name: princeton-nlp/SWE-bench_Lite
  split: test
  swebench_version: 4.0.3
  max_model_calls: 100
  max_total_tokens: 500000
  grading_timeout_seconds: 3600
  cache_level: env

artifacts:
  root: .harness
  retain_failed_runs: true
  retention_days: 30
  max_completed_runs: 100

logging:
  level: INFO
  json_file: logs/harness.jsonl
  max_bytes: 10000000
  backup_count: 3
  console: false
