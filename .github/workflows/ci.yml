name: CI

on:
  push:
  pull_request:

env:
  UV_VERSION: 0.7.19

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --dev
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not docker"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --dev
      - run: >-
          uv run pytest
          tests/test_investigation.py
          tests/test_planning.py
          tests/test_research.py
          tests/test_evaluation.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --dev
      - run: docker pull "python:3.11.13-slim-bookworm@sha256:86adf8dbadc3d6e82ee5dd2c74bec2e1c2467cdad47886280501df722372d2e1"
      - run: RUN_DOCKER_TESTS=1 uv run pytest -m docker
      - run: docker build -f docker/app.Dockerfile -t local-llm-harness:0.1.0 .
      - run: docker run --rm local-llm-harness:0.1.0 version

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --dev --extra swebench
      - run: uv run pytest tests/test_evaluation.py tests/test_swebench.py
