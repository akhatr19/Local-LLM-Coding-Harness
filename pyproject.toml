[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "local-llm-coding-harness"
version = "0.1.0"
description = "A staged, local-first coding harness for small language models."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Local LLM Coding Harness contributors" }]
dependencies = [
  "chromadb==1.0.13",
  "litellm==1.73.6",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pyyaml==6.0.2",
  "rich==14.0.0",
  "sentence-transformers==4.1.0",
  "typer==0.16.0",
]

[project.scripts]
harness = "local_llm_harness.cli:app"

[dependency-groups]
dev = [
  "pytest-asyncio==1.0.0",
  "pytest==8.4.1",
  "ruff==0.12.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/local_llm_harness"]

[tool.uv]
exclude-newer = "2025-07-01T00:00:00Z"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
